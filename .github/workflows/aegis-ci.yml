name: AEGIS CI

on:
  push:
    branches: [Aegis]
    paths:
      - "aegis/**"
      - "tests/test_aegis.py"
      - "requirements-aegis.txt"
      - ".github/workflows/aegis-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-aegis.txt
      - run: pytest -q tests/test_aegis.py
      - run: python -m aegis.demo
