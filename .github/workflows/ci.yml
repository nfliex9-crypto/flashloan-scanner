name: Funded Trader AI checks
on:
  push:
    branches: [agent-city-v1, funded-trader-ai]
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and test
        run: |
          python -m compileall -q funded_trader tests
          python -m unittest discover -s tests -v
      - name: Check dashboard JS
        run: node --check app.js
