name: Python checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-aegis.txt -r requirements-stream.txt
      - name: Compile Python
        run: python -m compileall -q scanner.py aegis api tests
      - name: Import scanner
        run: python -c "import scanner; print('scanner import OK')"
      - name: Check browser JavaScript syntax
        run: node --check city.js && node --check mission.js && node --check mt5-connect-ui.js && node --check ops-health.js
      - name: Verify Dashboard routes, deep links and hidden research evidence
        run: node --test tests/test_city_navigation.cjs
      - name: Verify standalone streaming worker imports
        run: python -c "from websockets.asyncio.client import connect; from aegis.stream_worker import KrakenMicroWorker; print('micro worker runtime OK')"
      - name: Run AEGIS tests
        run: PYTHONPATH=. pytest -q
