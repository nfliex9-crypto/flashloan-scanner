name: Python checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-aegis.txt
      - name: Compile Python
        run: python -m compileall -q scanner.py aegis api tests
      - name: Import scanner
        run: python -c "import scanner; print('scanner import OK')"
      - name: Run AEGIS tests
        run: pytest -q
