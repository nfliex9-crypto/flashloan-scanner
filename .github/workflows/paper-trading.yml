name: AEGIS Forward Paper Trading

on:
  push:
    branches: [Bot]
    paths:
      - ".github/workflows/paper-trading.yml"
      - "aegis/paper_worker.py"
      - "aegis/execution.py"
  schedule:
    # 15m Kraken bars close at :00/:15/:30/:45. Run ~3 minutes later.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aegis-paper-state
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout current production code
        uses: actions/checkout@v4
        with:
          ref: Bot
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load previous paper state
        shell: bash
        run: |
          git fetch origin paper-state
          mkdir -p data
          git show origin/paper-state:data/paper_state.json > data/paper_state.json 2>/dev/null || true

      - name: Run forward paper tick
        run: PYTHONPATH=. python -m aegis.paper_worker

      - name: Persist state to isolated paper-state branch
        shell: bash
        run: |
          cp data/paper_state.json /tmp/paper_state.json
          rm -f data/paper_state.json
          git switch paper-state
          git reset --hard origin/paper-state
          mkdir -p data
          cp /tmp/paper_state.json data/paper_state.json

          if [ -z "$(git status --porcelain -- data/paper_state.json)" ]; then
            echo "No new closed candle. Nothing to commit."
            exit 0
          fi

          git config user.name "aegis-paper-bot"
          git config user.email "aegis-paper-bot@users.noreply.github.com"
          git add data/paper_state.json
          git commit -m "paper: forward tick [skip ci]"
          git push origin HEAD:paper-state
